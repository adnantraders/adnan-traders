name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'google-services.json'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Firebase file is there
        run: |
          if [ ! -f google-services.json ]; then
            echo "google-services.json is missing. Upload it to the main page of the repository."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest icon-192.png icon-512.png www/ || true
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6 @capacitor/filesystem@6 @capacitor-firebase/authentication@6 firebase@10.12.2 @aparajita/capacitor-biometric-auth@8.0.2
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.adnantraders.app",
            "appName": "Adnan Traders",
            "webDir": "www",
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          EOF
          npx cap add android
          cp google-services.json android/app/google-services.json
          printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: App icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            cp icon-192.png $d/ic_launcher_foreground.png
          done

      - name: Signing key (same every time, so updates keep your data)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build the app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the app file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AdnanTraders.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app AdnanTraders.apk --title "Adnan Traders Android app" --notes "Download AdnanTraders.apk and install it."
